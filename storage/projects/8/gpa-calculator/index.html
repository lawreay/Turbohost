<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant 4.0 GPA Calculator</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #002b49;
            --accent: #f4b400;
            --bg: #f4f7fe;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            width: 100%;
            max-width: 850px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 300px;
        }

        /* Main Form Area */
        .main-panel {
            padding: 35px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .courses-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .course-row {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1fr 40px;
            gap: 12px;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            background: var(--white);
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 43, 73, 0.1);
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-remove:hover {
            background: #ef4444;
            color: var(--white);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add {
            background: var(--primary);
            color: var(--white);
        }

        .btn-add:hover {
            background: #004080;
        }

        .btn-reset {
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .btn-reset:hover {
            background: #e2e8f0;
            color: var(--text-dark);
        }

        /* Results Sidebar */
        .results-panel {
            background: linear-gradient(180deg, var(--primary) 0%, #001f35 100%);
            color: var(--white);
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .gpa-display {
            margin-top: 20px;
        }

        .gpa-display span {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 600;
        }

        .gpa-score {
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1.1;
            margin: 10px 0;
            color: var(--white);
        }

        .gpa-status {
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Progress Ring / Gauge Bar */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.4s ease;
        }

        .summary-info {
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        /* Mobile Responsiveness */
        @media (max-width: 720px) {
            .calculator-container {
                grid-template-columns: 1fr;
            }

            .course-row {
                grid-template-columns: 1fr 1fr 1fr 38px;
            }

            .results-panel {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <!-- Input Section -->
        <div class="main-panel">
            <div class="header">
                <h1><i class="fa-solid fa-calculator" style="color: var(--accent);"></i> GPA Calculator</h1>
                <p>Enter your courses, grades, and credit hours to calculate your instant 4.00 GPA.</p>
            </div>

            <div class="courses-list" id="courses-container">
                <!-- Dynamic Rows Inserted Here -->
            </div>

            <div class="actions">
                <button class="btn btn-add" onclick="addCourseRow()">
                    <i class="fa-solid fa-plus"></i> Add Course
                </button>
                <button class="btn btn-reset" onclick="resetCalculator()">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
            </div>
        </div>

        <!-- Result Sidebar -->
        <div class="results-panel">
            <div class="gpa-display">
                <span>Your GPA</span>
                <div class="gpa-score" id="gpa-value">0.00</div>
                <div class="gpa-status" id="gpa-status">Enter Grades</div>
            </div>

            <div style="width: 100%;">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="gpa-progress"></div>
                </div>

                <div class="summary-info">
                    <span>Total Credits: <strong id="total-credits" style="color: white;">0</strong></span>
                    <span>Total Points: <strong id="total-points" style="color: white;">0.0</strong></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Standard 4.0 Scale Grade Points
        const gradeScale = {
            "A": 4.00,
            "A-": 3.70,
            "B+": 3.30,
            "B": 3.00,
            "B-": 2.70,
            "C+": 2.30,
            "C": 2.00,
            "C-": 1.70,
            "D+": 1.30,
            "D": 1.00,
            "F": 0.00
        };

        let courseCount = 0;

        // Initialize with 4 default rows
        window.onload = () => {
            for (let i = 0; i < 4; i++) {
                addCourseRow();
            }
        };

        // Add a new row to the table
        function addCourseRow() {
            courseCount++;
            const container = document.getElementById('courses-container');

            const row = document.createElement('div');
            row.className = 'course-row';
            row.id = `course-row-${courseCount}`;

            row.innerHTML = `
                <input type="text" placeholder="Course ${courseCount}" class="course-name">
                <select class="course-grade" onchange="calculateGPA()">
                    <option value="">Grade</option>
                    <option value="A">A (4.00)</option>
                    <option value="A-">A- (3.70)</option>
                    <option value="B+">B+ (3.30)</option>
                    <option value="B">B (3.00)</option>
                    <option value="B-">B- (2.70)</option>
                    <option value="C+">C+ (2.30)</option>
                    <option value="C">C (2.00)</option>
                    <option value="C-">C- (1.70)</option>
                    <option value="D+">D+ (1.30)</option>
                    <option value="D">D (1.00)</option>
                    <option value="F">F (0.00)</option>
                </select>
                <input type="number" min="1" max="10" value="3" class="course-credits" placeholder="Credits" oninput="calculateGPA()">
                <button class="btn-remove" onclick="removeCourseRow('course-row-${courseCount}')" title="Remove Course">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;

            container.appendChild(row);
            calculateGPA();
        }

        // Remove a course row
        function removeCourseRow(rowId) {
            const row = document.getElementById(rowId);
            if (document.querySelectorAll('.course-row').length > 1) {
                row.remove();
                calculateGPA();
            } else {
                alert("You must keep at least one course.");
            }
        }

        // Calculate GPA in real-time
        function calculateGPA() {
            const grades = document.querySelectorAll('.course-grade');
            const credits = document.querySelectorAll('.course-credits');

            let totalQualityPoints = 0;
            let totalCredits = 0;

            for (let i = 0; i < grades.length; i++) {
                const gradeValue = grades[i].value;
                const creditValue = parseFloat(credits[i].value);

                if (gradeValue !== "" && !isNaN(creditValue) && creditValue > 0) {
                    const points = gradeScale[gradeValue];
                    totalQualityPoints += points * creditValue;
                    totalCredits += creditValue;
                }
            }

            // Update DOM Results
            const gpaValueElement = document.getElementById('gpa-value');
            const gpaStatusElement = document.getElementById('gpa-status');
            const progressBar = document.getElementById('gpa-progress');

            document.getElementById('total-credits').innerText = totalCredits;
            document.getElementById('total-points').innerText = totalQualityPoints.toFixed(1);

            if (totalCredits > 0) {
                const finalGPA = (totalQualityPoints / totalCredits).toFixed(2);
                gpaValueElement.innerText = finalGPA;

                // Update Progress Bar % (4.0 scale = 100%)
                const percentage = (finalGPA / 4.0) * 100;
                progressBar.style.width = `${percentage}%`;

                // Status Message Classification
                if (finalGPA >= 3.60) {
                    gpaStatusElement.innerText = "Distinction / First Class";
                } else if (finalGPA >= 3.00) {
                    gpaStatusElement.innerText = "Credit / Upper Second";
                } else if (finalGPA >= 2.00) {
                    gpaStatusElement.innerText = "Pass / Satisfactory";
                } else {
                    gpaStatusElement.innerText = "Academic Warning";
                }
            } else {
                gpaValueElement.innerText = "0.00";
                gpaStatusElement.innerText = "Enter Grades";
                progressBar.style.width = "0%";
            }
        }

        // Reset all fields
        function resetCalculator() {
            document.getElementById('courses-container').innerHTML = '';
            courseCount = 0;
            for (let i = 0; i < 4; i++) {
                addCourseRow();
            }
        }
    </script>
</body>
</html>

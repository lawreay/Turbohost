<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Bites - Donuts & Buns MK600</title>
<style>
  :root {
    --pink: #f472b6;
    --brown: #a16207;
    --bg: #fff7ed;
    --card: #ffffff;
    --text: #1f2937;
  }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--bg); color: var(--text); }

  header {
    background: linear-gradient(135deg, var(--pink), #ec4899);
    color: white; text-align: center; padding: 3rem 1rem; position: relative;
  }
 .settings-btn {
    position: absolute; top: 15px; right: 20px;
    background: white; color: var(--pink); border: none;
    padding: 0.6rem 0.9rem; border-radius: 10px; cursor: pointer; font-size: 1.2rem;
  }
  header h1 { font-size: 2.5rem; }
 .price-badge {
    background: white; color: var(--pink); padding: 0.5rem 1rem;
    border-radius: 50px; display: inline-block; margin-top: 1rem; font-weight: bold; font-size: 1.3rem;
  }

  /* SLIDING SIDEBAR */
 .sidebar {
    position: fixed; top: 0; right: -350px; width: 330px; height: 100%;
    background: var(--card); box-shadow: -4px 0 15px rgba(0,0,0,0.1);
    transition: right 0.3s ease; padding: 1.5rem; z-index: 1000; overflow-y: auto;
  }
 .sidebar.active { right: 0; }
 .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4); display: none; z-index: 999;
  }
 .overlay.active { display: block; }
 .close-btn { float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer; }

  /* OWNER PROFILE */
 .owner-profile {
    text-align: center; padding: 1rem; border-bottom: 1px solid #eee; margin-bottom: 1rem;
  }
 .owner-profile img {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--pink);
  }
 .owner-profile h4 { margin-top: 0.5rem; color: var(--brown); }

  /* NOTIFICATION POPUP */
 .notification {
    position: fixed; top: 20px; right: -400px; background: #10b981; color: white;
    padding: 1rem 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: right 0.4s ease; z-index: 2000; font-weight: 600;
  }
 .notification.show { right: 20px; }

  /* PRODUCTS + ORDER */
 .container { max-width: 1100px; margin: 3rem auto; padding: 0 1rem; }
 .products {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;
  }
 .card {
    background: var(--card); border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    overflow: hidden; text-align: center;
  }
 .card img { width: 100%; height: 220px; object-fit: cover; }
 .card-content { padding: 1.5rem; }
 .card.price { font-size: 1.8rem; color: var(--pink); font-weight: bold; }

 .btn {
    background: var(--pink); color: white; border: none; padding: 0.8rem 1.5rem;
    border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 0.5rem;
  }
  input, textarea { width: 100%; padding: 0.8rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 8px; }

  /* ADMIN ORDER LOG */
 .order-log { max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 0.5rem; border-radius: 8px; font-size: 0.9rem; }
 .log-item { padding: 0.5rem; border-bottom: 1px dashed #eee; }

 .whatsapp {
    position: fixed; bottom: 20px; right: 20px;
    background: #25D366; color: white; padding: 1rem 1.5rem;
    border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 998;
  }
</style>
</head>
<body>

<header>
  <button class="settings-btn" onclick="toggleSidebar()">⚙️</button>
  <h1 id="shopName">🍩 Sweet Bites Bakery</h1>
  <p id="tagline">Freshly baked Donuts & Buns every morning</p>
  <div class="price-badge" id="priceBadge">Only MK600 Each!</div>
</header>

<!-- OVERLAY + SIDEBAR -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <button class="close-btn" onclick="toggleSidebar()">×</button>

  <!-- OWNER PROFILE -->
  <div class="owner-profile">
    <img id="ownerImg" src="https://i.pravatar.cc/100" alt="Owner">
    <h4 id="ownerName">Grace Banda</h4>
    <p id="ownerBio" style="font-size:0.9rem; color:#6b7280;">Founder & Head Baker. Baking fresh since 2022 ❤️</p>
    <input type="file" id="ownerPhotoUpload" accept="image/*" onchange="uploadOwnerPhoto(event)">
  </div>

  <h3>Settings</h3>
  <label>Shop Name</label>
  <input type="text" id="setShopName">
  <label>Owner Name</label>
  <input type="text" id="setOwnerName">
  <label>Owner Bio</label>
  <textarea id="setOwnerBio" rows="2"></textarea>
  <label>Price Per Item MK</label>
  <input type="number" id="setPrice">
  <label>WhatsApp Number</label>
  <input type="text" id="setWhatsApp">
  <button class="btn" onclick="saveSettings()">Save Settings</button>

  <h3 style="margin-top:1.5rem;">📦 Recent Orders</h3>
  <div class="order-log" id="orderLog">No orders yet</div>
</div>

<!-- NOTIFICATION -->
<div class="notification" id="notification">New Order Received!</div>
<audio id="dingSound" src="https://cdn.freesound.org/previews/270/270404_5123851-lq.mp3"></audio>

<div class="container">
  <div class="products">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1551024601-bec78aea3733?q=80&w=800">
      <div class="card-content">
        <h3>Soft Donuts</h3>
        <div class="price" id="donutPrice">MK600</div>
        <button class="btn" onclick="orderItem('Donut')">Order Donut</button>
      </div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1509365465985-25d11c17e812?q=80&w=800">
      <div class="card-content">
        <h3>Sweet Buns</h3>
        <div class="price" id="bunPrice">MK600</div>
        <button class="btn" onclick="orderItem('Bun')">Order Bun</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:2rem; padding:1.5rem;">
    <h2>📞 Place Your Order</h2>
    <input type="text" id="name" placeholder="Your Name">
    <input type="tel" id="phone" placeholder="Your WhatsApp Number">
    <input type="text" id="item" placeholder="Item" readonly>
    <input type="number" id="qty" placeholder="Quantity" value="1" min="1">
    <textarea id="location" rows="2" placeholder="Delivery Location"></textarea>
    <button class="btn" onclick="sendOrder()">Send Order via WhatsApp</button>
  </div>
</div>

<a href="https://wa.me/265XXXXXXXXX" id="waBtn" class="whatsapp" target="_blank">Chat on WhatsApp</a>

<script>
  let settings = JSON.parse(localStorage.getItem('sb_settings')) || {
    shopName: "Sweet Bites Bakery", tagline: "Freshly baked Donuts & Buns every morning",
    price: 600, whatsapp: "265XXXXXXXXX",
    ownerName: "Grace Banda", ownerBio: "Founder & Head Baker. Baking fresh since 2022 ❤️", ownerImg: "https://i.pravatar.cc/100"
  };
  let orders = JSON.parse(localStorage.getItem('sb_orders')) || [];

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
  }

  function showNotification(text) {
    const notif = document.getElementById('notification');
    notif.innerText = text;
    notif.classList.add('show');
    document.getElementById('dingSound').play();
    setTimeout(() => notif.classList.remove('show'), 4000);
  }

  function saveSettings() {
    settings.shopName = document.getElementById('setShopName').value;
    settings.ownerName = document.getElementById('setOwnerName').value;
    settings.ownerBio = document.getElementById('setOwnerBio').value;
    settings.price = parseInt(document.getElementById('setPrice').value);
    settings.whatsapp = document.getElementById('setWhatsApp').value;
    localStorage.setItem('sb_settings', JSON.stringify(settings));
    applySettings(); toggleSidebar(); showNotification("Settings Saved!");
  }

  function uploadOwnerPhoto(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      settings.ownerImg = ev.target.result;
      localStorage.setItem('sb_settings', JSON.stringify(settings));
      applySettings();
    }
    reader.readAsDataURL(file);
  }

  function applySettings() {
    document.getElementById('shopName').innerText = `🍩 ${settings.shopName}`;
    document.getElementById('tagline').innerText = settings.tagline;
    document.getElementById('priceBadge').innerText = `Only MK${settings.price} Each!`;
    document.getElementById('donutPrice').innerText = `MK${settings.price}`;
    document.getElementById('bunPrice').innerText = `MK${settings.price}`;
    document.getElementById('waBtn').href = `https://wa.me/${settings.whatsapp}`;
    document.getElementById('ownerName').innerText = settings.ownerName;
    document.getElementById('ownerBio').innerText = settings.ownerBio;
    document.getElementById('ownerImg').src = settings.ownerImg;
    // fill form
    document.getElementById('setShopName').value = settings.shopName;
    document.getElementById('setOwnerName').value = settings.ownerName;
    document.getElementById('setOwnerBio').value = settings.ownerBio;
    document.getElementById('setPrice').value = settings.price;
    document.getElementById('setWhatsApp').value = settings.whatsapp;
    loadOrders();
  }

  function orderItem(itemName) {
    document.getElementById('item').value = itemName;
    document.querySelector('.card:last-of-type').scrollIntoView({ behavior: 'smooth' });
  }

  function sendOrder() {
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const item = document.getElementById('item').value;
    const qty = document.getElementById('qty').value;
    const location = document.getElementById('location').value;
    if(!name ||!phone ||!item) return alert("Please fill all fields");

    const price = item.includes('Combo')? settings.price * 4 : settings.price;
    const total = price * qty;
    const order = { id: Date.now(), name, phone, item, qty, total, location, time: new Date().toLocaleString() };

    orders.unshift(order);
    localStorage.setItem('sb_orders', JSON.stringify(orders));

    showNotification(`New Order: ${qty}x ${item} from ${name}`);
    addOrderToLog(order);

    const message = `Hi ${settings.shopName}!%0AName: ${name}%0AItem: ${item} x${qty}%0ATotal: MK${total}%0ALocation: ${location}`;
    window.open(`https://wa.me/${settings.whatsapp}?text=${message}`, '_blank');
  }

  function addOrderToLog(order) {
    const log = document.getElementById('orderLog');
    if(log.innerText === "No orders yet") log.innerHTML = "";
    log.innerHTML = `<div class="log-item"><b>${order.name}</b> ordered ${order.qty}x ${order.item}<br>MK${order.total} • ${order.time}</div>` + log.innerHTML;
  }

  function loadOrders() {
    const log = document.getElementById('orderLog');
    if(orders.length === 0) return;
    log.innerHTML = orders.map(o =>
      `<div class="log-item"><b>${o.name}</b> ordered ${o.qty}x ${o.item}<br>MK${o.total} • ${o.time}</div>`
    ).join('');
  }

  applySettings();
</script>
</body>
</html>

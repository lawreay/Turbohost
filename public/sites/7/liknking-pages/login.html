<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurboHostMw Authentication</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --primary:#2563EB;
    --secondary:#06B6D4;
    --dark:#e2dddd;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:var(--dark);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-container{
    width:1200px;
    max-width:100%;
    min-height:720px;
    display:flex;
    background:#fff;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
}

/* LEFT PANEL */

.left-panel{
    width:40%;
    position:relative;
    background:linear-gradient(
    135deg,
    var(--primary),
    var(--secondary)
    );
    overflow:hidden;
}

.left-panel::before{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    background:rgba(255,255,255,.08);
    transform:rotate(45deg);
    top:-250px;
    left:-250px;
}

.left-panel::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,255,255,.08);
    transform:rotate(45deg);
    bottom:-200px;
    right:-200px;
}

.welcome-box{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:40px;
}

.welcome-box h2{
    font-size:38px;
    font-weight:700;
    margin-bottom:15px;
}

.welcome-box p{
    font-size:18px;
    opacity:.9;
    margin-bottom:30px;
}

.switch-btn{
    border:2px solid white;
    background:none;
    color:white;
    padding:12px 35px;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.switch-btn:hover{
    background:white;
    color:var(--primary);
}

/* RIGHT PANEL */

.right-panel{
    width:60%;
    padding:60px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-weight:800;
    color:var(--primary);
}

.logo p{
    color:#666;
}

.form-wrapper{
    display:none;
    animation:fade .4s ease;
}

.form-wrapper.active{
    display:block;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.form-control{
    border:none;
    border-bottom:2px solid #ddd;
    border-radius:0;
    padding:15px;
}

.form-control:focus{
    box-shadow:none;
    border-color:var(--primary);
}

.main-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:50px;
    background:linear-gradient(
    90deg,
    var(--primary),
    var(--secondary)
    );
    color:white;
    font-weight:700;
    margin-top:20px;
}

.main-btn:hover{
    opacity:.9;
}

.divider{
    text-align:center;
    margin:25px 0;
    color:#777;
}

.social-btn{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:12px;
    background:white;
}

.social-btn:hover{
    background:#f8f9fa;
}

.password-toggle{
    position:absolute;
    right:10px;
    top:15px;
    cursor:pointer;
}

#passwordMessage{
    font-size:14px;
    margin-top:5px;
}

a{
    text-decoration:none;
}

@media(max-width:992px){

.login-container{
    flex-direction:column;
}

.left-panel,
.right-panel{
    width:100%;
}

.left-panel{
    min-height:250px;
}

.right-panel{
    padding:30px;
}

}
</style>
</head>
<body>

<div class="login-container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="welcome-box">

            <h2 id="welcomeTitle">
                Welcome Back!
            </h2>

            <p id="welcomeText">
                Login to manage your websites,
                hosting and analytics.
            </p>

            <button
            class="switch-btn"
            id="switchBtn">

                Create Account

            </button>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <!-- LOGIN -->

        <div class="form-wrapper active" id="loginForm">

            <div class="logo">
                <h1>TurboHostMw</h1>
                <p>Login to your account</p>
            </div>

            <form>

                <div class="mb-4">
                    <input
                    type="email"
                    class="form-control"
                    placeholder="Email Address">
                </div>

                <div class="mb-3 position-relative">

                    <input
                    type="password"
                    class="form-control"
                    id="loginPassword"
                    placeholder="Password">

                    <span
                    class="password-toggle"
                    onclick="togglePassword('loginPassword',this)">
                    👁
                    </span>

                </div>

                <div class="d-flex justify-content-between mb-3">

                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#"
                    data-bs-toggle="modal"
                    data-bs-target="#forgotModal">
                        Forgot Password?
                    </a>

                </div>

                <button
                type="submit"
                class="main-btn">
                    LOGIN
                </button>

            </form>

        </div>

        <!-- REGISTER -->

        <div class="form-wrapper" id="registerForm">

            <div class="logo">
                <h1>TurboHostMw</h1>
                <p>Create your account</p>
            </div>

            <form>

                <input
                type="text"
                class="form-control mb-3"
                placeholder="Full Name">

                <input
                type="text"
                class="form-control mb-3"
                placeholder="Username">

                <input
                type="email"
                class="form-control mb-3"
                placeholder="Email Address">

                <input
                type="tel"
                class="form-control mb-3"
                placeholder="Phone Number">

                <select
                class="form-control mb-3">

                    <option>Select Country</option>
                    <option>Malawi</option>
                    <option>Zambia</option>
                    <option>Tanzania</option>
                    <option>Kenya</option>
                    <option>South Africa</option>
                    <option>USA</option>
                    <option>Canada</option>
                    <option>United Kingdom</option>

                </select>

                <div class="position-relative mb-3">

                    <input
                    type="password"
                    id="registerPassword"
                    class="form-control"
                    placeholder="Password">

                    <span
                    class="password-toggle"
                    onclick="togglePassword('registerPassword',this)">
                    👁
                    </span>

                </div>

                <div class="position-relative mb-3">

                    <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm Password">

                    <span
                    class="password-toggle"
                    onclick="togglePassword('confirmPassword',this)">
                    👁
                    </span>

                </div>

                <div id="passwordMessage"></div>

                <button
                type="submit"
                class="main-btn">
                    CREATE ACCOUNT
                </button>

            </form>

        </div>

        <div class="divider">
            Or continue with
        </div>

        <div class="row">

            <div class="col-md-6 mb-2">
                <button class="social-btn">
                    Google
                </button>
            </div>

            <div class="col-md-6 mb-2">
                <button class="social-btn">
                    GitHub
                </button>
            </div>

        </div>

    </div>

</div>

<!-- FORGOT PASSWORD MODAL -->

<div class="modal fade"
id="forgotModal"
tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Reset Password
                </h5>

                <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <p>
                    Enter your email address
                    and we'll send a reset link.
                </p>

                <input
                type="email"
                id="resetEmail"
                class="form-control"
                placeholder="Email Address">

                <small class="text-muted">
                    Reset links expire after 30 minutes.
                </small>

            </div>

            <div class="modal-footer">

                <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                type="button"
                class="btn btn-primary"
                onclick="sendResetLink()">
                    Send Reset Link
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* LOGIN / REGISTER SWITCH */

let loginMode = true;

const switchBtn =
document.getElementById('switchBtn');

const loginForm =
document.getElementById('loginForm');

const registerForm =
document.getElementById('registerForm');

const welcomeTitle =
document.getElementById('welcomeTitle');

const welcomeText =
document.getElementById('welcomeText');

switchBtn.addEventListener('click',()=>{

loginMode = !loginMode;

if(loginMode){

loginForm.classList.add('active');
registerForm.classList.remove('active');

welcomeTitle.innerText =
'Welcome Back!';

welcomeText.innerText =
'Login to manage your websites, hosting and analytics.';

switchBtn.innerText =
'Create Account';

}else{

registerForm.classList.add('active');
loginForm.classList.remove('active');

welcomeTitle.innerText =
'Join TurboHostMw';

welcomeText.innerText =
'Create and host websites in minutes with TurboHostMw.';

switchBtn.innerText =
'Login';

}

});

/* PASSWORD TOGGLE */

function togglePassword(id,icon){

const field =
document.getElementById(id);

if(field.type === 'password'){

field.type = 'text';
icon.innerHTML = '🙈';

}else{

field.type = 'password';
icon.innerHTML = '👁';

}

}

/* PASSWORD MATCH */

const password =
document.getElementById('registerPassword');

const confirmPassword =
document.getElementById('confirmPassword');

const message =
document.getElementById('passwordMessage');

confirmPassword.addEventListener('keyup',()=>{

if(password.value !== confirmPassword.value){

message.innerHTML =
'❌ Passwords do not match';

message.style.color = 'red';

}else{

message.innerHTML =
'✅ Passwords match';

message.style.color = 'green';

}

});

/* RESET PASSWORD */

function sendResetLink(){

const email =
document.getElementById('resetEmail').value;

if(email === ''){

alert('Please enter your email address.');
return;

}

alert(
'Reset link sent to: ' + email
);

const modal =
bootstrap.Modal.getInstance(
document.getElementById('forgotModal')
);

modal.hide();

}

</script>

</body>
</html>
